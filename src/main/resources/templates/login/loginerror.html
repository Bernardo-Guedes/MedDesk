<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedDesk - Entrar</title>

    <link rel="icon" type="image/png" href="../../static/images/iconSite.png" th:href="@{/images/iconSite.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../static/css/defaultStyle.css" th:href="@{/css/defaultStyle.css}">
    <link rel="stylesheet" href="../../static/css/login/login.css" th:href="@{/css/login.css}">
</head>
<body class="pagina-login">
    <main class="estrutura-login">

        <!-- PAINEL DE BOAS-VINDAS (ESQUERDA) -->
        <section class="painel-boas-vindas">
            <img src="../../static/images/logoMedDesk.png" th:src="@{/images/logoMedDeskColorido.png}" alt="MedDesk Logo" class="logo-login">

            <div>
                <h2 class="titulo-boas-vindas">Bem-vindo!</h2>
                <p class="texto-boas-vindas">
                    Entre ou crie uma conta para acessar todos os recursos do sistema
                    e gerenciar seu atendimento com mais facilidade.
                </p>
            </div>
        </section>

        <!-- CARTÃO DE LOGIN (DIREITA) -->
        <section class="cartao cartao-login">

            <header class="cabecalho-login">
                <img src="../../static/images/perfilIconAzul.svg" th:src="@{/images/perfilIconAzul.svg}" alt="" class="icone-titulo">
                <div>
                    <h1 class="titulo-pagina mensagem-erro">Falha ao efetuar o Login!</h1>
                    <p class="subtitulo-login mensagem-erro">E-mail ou senha incorretos.</p>
                </div>
            </header>

            <form class="formulario" th:action="@{/login}" method="post">

                <!-- USUÁRIO / E-MAIL -->
                <div class="grupo-formulario">
                    <label class="rotulo-formulario" for="usuario">Nome de usuário ou e-mail</label>
                    <div class="campo-icone">
                        <span class="icone-campo">
                            <img src="../../static/images/perfilIconAzul.svg" th:src="@{/images/perfilIconAzul.svg}" alt="">
                        </span>
                        <input type="text" id="usuario" name="username" class="campo-formulario"
                               placeholder="Digite seu nome de usuário ou e-mail"
                               autocomplete="username" required>
                    </div>
                </div>

                <!-- SENHA -->
                <div class="grupo-formulario">
                    <label class="rotulo-formulario" for="senha">Senha</label>
                    <div class="campo-icone">
                        <span class="icone-campo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="4" y="11" width="16" height="10" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                                <circle cx="12" cy="16" r="1"/>
                            </svg>
                        </span>
                        <input type="password" id="senha" name="password" class="campo-formulario"
                               placeholder="Digite sua senha"
                               autocomplete="current-password" required>
                        <button type="button" id="alternar-senha" class="botao-icone"
                                aria-label="Mostrar senha" aria-pressed="false">
                            <svg id="icone-olho-visivel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao-principal botao-bloco">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Entrar
                </button>

                <div class="divisor-ou">ou</div>

                <a href="register.html" th:href="@{/register}" class="botao-contorno botao-bloco">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                    Criar conta
                </a>
            </form>
        </section>
    </main>
</body>
</html>
