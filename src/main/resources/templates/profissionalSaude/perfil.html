<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedDesk - Perfil</title>

    <link rel="icon" type="image/png" href="../../static/images/iconSite.png" th:href="@{/images/iconSite.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../static/css/defaultStyle.css" th:href="@{/css/defaultStyle.css}">
    <link rel="stylesheet" href="../../static/css/profissionalSaude/perfil.css" th:href="@{/css/profissionalSaude/perfil.css}">
</head>
<body>
    <div class="estrutura-aplicativo">

        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="barra-lateral">
            <div class="cabecalho-barra-lateral">
                <img src="../../static/images/logoMedDesk.png" th:src="@{/images/logoMedDesk.png}" alt="MedDesk Logo" class="imagem-logo">
            </div>

            <nav class="navegacao-lateral">
                <!-- Ícone e texto definidos estritamente como Inicio -->
                <a href="home.html" th:href="@{home.html}" class="item-navegacao">
                    <img src="../../static/images/inicioIcon.svg" th:src="@{/images/inicioIcon.svg}" alt="Início" class="icone-navegacao">
                    <span>Início</span>
                </a>
                <a href="consultasAgendadas.html" class="item-navegacao">
                    <img src="../../static/images/agendaIcon.svg" th:src="@{/images/agendaIcon.svg}" alt="Agenda" class="icone-navegacao">
                    <span>Agenda</span>
                </a>
                <a href="novaConsulta.html" class="item-navegacao">
                    <img src="../../static/images/novaConsultaIcon.svg" th:src="@{/images/novaConsultaIcon.svg}" alt="Nova Consulta" class="icone-navegacao">
                    <span>Nova Consulta</span>
                </a>
                <!-- Item Perfil ativo -->
                <a href="perfil.html" class="item-navegacao ativo">
                    <img src="../../static/images/perfilIconAzul.svg" th:src="@{/images/perfilIconAzul.svg}" alt="Perfil" class="icone-navegacao">
                    <span>Perfil</span>
                </a>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="conteudo-principal">

            <!-- CABEÇALHO SUPERIOR ESCURO -->
            <header class="cabecalho-superior">
                <div class="perfil-usuario">
                    <div class="informacoes-usuario">
                        <span class="nome-usuario">Dr. Carlos Sales</span>
                        <span class="funcao-usuario">Pediatra</span>
                    </div>
                    <div class="avatar-usuario"></div>
                </div>
            </header>

            <!-- BARRA DE TÍTULO -->
            <div class="barra-titulo-pagina">
                <img src="../../static/images/perfilIconAzul.svg" th:src="@{/images/perfilIconAzul.svg}" alt="Ícone Perfil" class="icone-titulo">
                <h1 class="titulo-pagina">O Meu Perfil</h1>
            </div>

            <!-- ÁREA DE CONTEÚDO ROLÁVEL -->
            <div class="area-conteudo">

                <!-- GRELHA DO PERFIL (Esquerda: Resumo | Direita: Formulário) -->
                <div class="estrutura-perfil">
                    
                    <!-- CARTÃO RESUMO (COLUNA ESQUERDA) -->
                    <div class="cartao texto-centralizado">
                        <div class="avatar-perfil-grande"></div>
                        <h2 class="nome-perfil">Dr. Carlos Sales</h2>
                        <p class="especialidade-perfil">Pediatra</p>
                        
                        <div class="selos-perfil">
                            <span class="selo">CRM: 45892-MG</span>
                        </div>
                        
                        <button class="botao-contorno botao-foto-perfil">Alterar Fotografia</button>
                    </div>

                    <!-- CARTÃO FORMULÁRIO (COLUNA DIREITA) -->
                    <div class="cartao">
                        <h3 class="titulo-secao-formulario">Informações Pessoais</h3>
                        
                        <form class="formulario">
                            <!-- Linha 1: Nome e Registo (BLOQUEADOS) -->
                            <div class="linha-formulario">
                                <div class="grupo-formulario">
                                    <label class="rotulo-formulario">Nome</label>
                                    <!-- Atributo 'disabled' adicionado -->
                                    <input type="text" class="campo-formulario" value="Carlos Eduardo Sales" disabled>
                                </div>
                                <div class="grupo-formulario">
                                    <label class="rotulo-formulario">Registro profissional</label>
                                    <!-- Atributo 'disabled' adicionado -->
                                    <input type="text" class="campo-formulario" value="CRM 45892-MG" disabled>
                                </div>
                            </div>

                            <!-- Linha 2: Especialidade (BLOQUEADO) e Telefone (LIVRE) -->
                            <div class="linha-formulario">
                                <div class="grupo-formulario">
                                    <label class="rotulo-formulario">Especialidade</label>
                                    <!-- Atributo 'disabled' adicionado -->
                                    <input type="text" class="campo-formulario" value="Pediatria" disabled>
                                </div>
                                <div class="grupo-formulario">
                                    <label class="rotulo-formulario">Telefone</label>
                                    <input type="tel" class="campo-formulario" value="+55 (31) 98765-4321">
                                </div>
                            </div>

                            <!-- Linha 3: E-mail (LIVRE) -->
                            <div class="grupo-formulario grupo-email-perfil">
                                <label class="rotulo-formulario">E-mail para contato</label>
                                <input type="email" class="campo-formulario" value="carlos.sales@meddesk.com">
                            </div>

                            <hr class="divisor-formulario">

                            <div class="acoes-formulario">
                                <button type="button" class="botao-contorno">Cancelar</button>
                                <button type="button" class="botao-principal">Guardar Alterações</button>
                            </div>
                        </form>
                    </div>

                </div>

            </div>
        </main>
    </div>
</body>
</html>
